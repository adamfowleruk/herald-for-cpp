// This file lists the commands and responses from the Herald MESH Modem.
// This file makes heavy use of low-level data formats in other proto files.
// The contents of this file are specific to herald-mesh-modem and
// herald-mesh-rmq-adapter, but can be used by any app issuing and receiving
// responses to Herald Mesh Modem commands.

syntax = "proto3";

package herald.mesh.messages;

// import "google/protobuf/any.proto";

// Import low level Bluetooth MESH functionality
import "herald/mesh/messages/mesh.proto";
// Import Herald MESH Model message formats (data only)
import "herald/mesh/messages/models.proto";

// option cc_enable_arenas = true;
option optimize_for = CODE_SIZE;

// MARK: INITIAL CONNECTION FUNCTIONS

// Test we can talk to the modem over the tty driver.
// Reply using the specified commandId number (NON ZERO).
message Hello {
  uint64 commandId = 1;
}

// // A REPLY message for a General purposes Ok command response.
message Ok {
  uint64 commandId = 1;
}

// A REPLY message for an invalid issued command
message Invalid {
  uint64 commandId = 1;

  optional string explanation = 2;
}

// A REPLY message indicating the command timed out
message TimedOut {
  uint64 commandId = 1;
}






// MARK: NETWORK COMMUNICATION FUNCTIONS

// Sets the Bluetooth MESH Network key, allowing the modem USB key 
// to communicate with the MESH.
message SetNetworkKey {
  uint64 commandId = 1;

  uint64 key = 2;
}

// TODO set this modem node's own app keys too






// MARK: GENERIC PURPOSE LOW LEVEL BLUETOOTH MESH FUNCTIONS

// Get Mesh Model value command.
// Reply with Ok or Invalid or TimedOut
message MeshGetCommand {
  uint64 commandId = 1;

  MeshGet get = 2;
}

message MeshSetCommand {
  uint64 commandId = 1;

  MeshSet set = 2;
}

message MeshSubscribeCommand {
  uint64 commandId = 1;

  MeshSubscribe subscribe = 2;
}

message MeshUnsubscribeCommand {
  uint64 commandId = 1;

  MeshUnsubscribe unsubscribe = 2;
}

message MeshPublishCommand {
  uint64 commandId = 1;

  MeshPublish publish = 2;
}

message MeshSendCommand {
  uint64 commandId = 1;

  MeshSend send = 2;
}






// MARK: INFORMATIONAL COMMANDS

// Requests the known Mesh nodes from this Modem.
// May be accomplished via a routing table, or Ping.
// Method decided by the modem itself.
message GetKnownMeshNodes {
  uint64 commandId = 1;

  // If requested from a specific node on the mesh (I.e. not just modems)
  optional uint32 fromNodeId = 2;
}

// A basic summary about a Bluetooth MESH Node
message MeshNodeSummary {
  uint32 nodeId = 2;
}

// A REPLY message from the Modem, specific to GetKnownMeshNodes replies.
// Note there may be multiple replies, one per Mesh Modem.
message KnownMeshNodes {
  uint64 commandId = 1;

  // The node ID responding to this query (may be a modem)
  uint32 nodeId = 2;
  repeated MeshNodeSummary known = 3;
}