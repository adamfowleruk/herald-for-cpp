# FROM MESH NEEDS

# General configuration
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# Below required for BT_SETTINGS` 
CONFIG_SETTINGS=y
CONFIG_HWINFO=y
CONFIG_DK_LIBRARY=y

# Bluetooth configuration
CONFIG_BT=y
# Use Linux Foundation code
CONFIG_BT_COMPANY_ID=0x0059
#CONFIG_BT_DEVICE_NAME="Mesh and Peripheral Coex"
CONFIG_BT_L2CAP_TX_MTU=69
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SETTINGS=y

CONFIG_BT_EXT_ADV=y
# This defaults to 1!
CONFIG_BT_EXT_ADV_MAX_ADV_SET=5
# CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
# CONFIG_BT_MAX_CONN=3

# USE THE FOLLOWING FOR HOST ONLY BUILD (E.g. nRF5340dk)
# CONFIG_BT_CTLR=n
# USE THE FOLLOWING FOR COMBINED BUILD (E.g. SoC, any other DK)
CONFIG_BT_CTLR=y
CONFIG_BT_LL_SW_SPLIT=y
# ^ Last one is if using opensource LL only (I.e. not Nordics)

# Disable unused Bluetooth features
CONFIG_BT_HCI=y
# CONFIG_BT_CTLR_DUP_FILTER_LEN=0
# CONFIG_BT_CTLR_LE_ENC=n
CONFIG_BT_DATA_LEN_UPDATE=n
CONFIG_BT_PHY_UPDATE=n
# CONFIG_BT_CTLR_CHAN_SEL_2=n
# CONFIG_BT_CTLR_MIN_USED_CHAN=n
CONFIG_BT_CTLR_PRIVACY=n

# Use the BLE 5.0 2M phy for more ADV_EXT throughput
# TODO verify it's actually being used
# CONFIG_BT_CTLR_PHY_2M=y

# Bluetooth mesh configuration
CONFIG_BT_MESH=y
CONFIG_BT_MESH_RELAY=y
CONFIG_BT_MESH_FRIEND=y
CONFIG_BT_MESH_ADV_BUF_COUNT=13
CONFIG_BT_MESH_RX_SEG_MAX=10
CONFIG_BT_MESH_TX_SEG_MAX=10
CONFIG_BT_MESH_PB_GATT=y
CONFIG_BT_MESH_PROXY_USE_DEVICE_NAME=y
# The following is needed to set mesh model and publishing config from a phone
CONFIG_BT_MESH_GATT_PROXY=y
# ^^^ I suspect this interferes with Herald's ability to restart scanning 
#     (it leaves a connection open to the nRF MESH phone app)
# TODO replace the below with a Herald NFC provisioner instead
CONFIG_BT_MESH_DK_PROV=n
# ^^^ Note we're using a no_oob_prov implementation in this app for now

# The following is separate from BT_EXT_ADV
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_MESH_ADV_EXT=y

# Bluetooth mesh models
CONFIG_BT_MESH_ONOFF_SRV=y

# Enable the LBS service
CONFIG_BT_LBS=n
CONFIG_BT_LBS_POLL_BUTTON=n

# CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
# CONFIG_UART_CONSOLE=n

# DEBUG ONLY - Allows resetting of provisioning state via RTT (mesh reset)
# CONFIG_BT_MESH_SHELL=y
# CONFIG_SHELL_BACKEND_RTT=y

CONFIG_BT_DEBUG_LOG=y
CONFIG_BT_MESH_DEBUG=y
CONFIG_BT_MESH_DEBUG_MODEL=y
CONFIG_BT_MESH_DEBUG_ACCESS=y
CONFIG_BT_MESH_DEBUG_MODEL=y
CONFIG_BT_MESH_DEBUG_TRANS=n
CONFIG_BT_MESH_DEBUG_NET=n
CONFIG_BT_MESH_DEBUG_CRYPTO=n
CONFIG_BT_MESH_DEBUG_ADV=y


# For issues with advertising failing:-
# CONFIG_BT_DEBUG_HCI_DRIVER=y
# CONFIG_BT_DEBUG_HCI_CORE=y
# CONFIG_BT_DEBUG_CONN=y





# The following are used for fine adjustment prior to using separate conf files
CONFIG_BT_MAX_CONN=10
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_USB_DEVICE_STACK=n
#   The following are for Herald functionality
CONFIG_BT_CENTRAL=y
CONFIG_BT_DIS=y
#   The GATT discovery library (for Herald device introspection)
CONFIG_BT_GATT_DM=y
CONFIG_BT_GATT_CLIENT=y
#   The following is RANDOM from NRF ONLY and not defined in their scan.h:221:29
#     It sets CONFIG_BT_SCAN_UUID_CNT=? something
CONFIG_BT_SCAN=y
#   The following is for Herald C++ libs (STDLIB C++)
CONFIG_CPLUSPLUS=y
CONFIG_NEWLIB_LIBC=y
CONFIG_LIB_CPLUSPLUS=y
#   The following are space saving attempts for nrf53822dk
CONFIG_EXCEPTIONS=n
CONFIG_I2C=n
CONFIG_WATCHDOG=n
CONFIG_PINMUX=n
CONFIG_SPI=n
CONFIG_IDLE_STACK_SIZE=256
#   Stops issues with disconnect MPU stack faults (Bug in zephyr/NCS?)
CONFIG_ARM_MPU=n

# MESH RELAY APP SPECIFIC SETTINGS
# Allow scanning with the non-private identity address
CONFIG_BT_SCAN_WITH_IDENTITY=y

# Copied Debug settings
# BEGIN DEBUG ONLY SETTINGS - NOT FOR PRODUCTION
CONFIG_GPIO=y
CONFIG_UART_CONSOLE=n
# Debug log settings
CONFIG_LOG_STRDUP_BUF_COUNT=200
CONFIG_LOG_STRDUP_MAX_STRING=256
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CONSOLE=y
CONFIG_CONSOLE_INPUT_MAX_LINE_LEN=128
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_SHOW_COLOR=y
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_BUFFER_SIZE=2048
# Allow easier finding of errors in demo apps
CONFIG_RESET_ON_FATAL_ERROR=n
# Force halt on asserts
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
# Memory tuning discovery flags
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=512
CONFIG_THREAD_ANALYZER_RUN_UNLOCKED=y
CONFIG_THREAD_ANALYZER_USE_LOG=y